services:
  curator:
    image: ghcr.io/OWNER/immich-curator:v0.2.0
    container_name: immich-curator
    restart: "no"
    environment:
      IMMICH_BASE_URL: "http://immich.example.local:2283"
      IMMICH_API_KEY: "REPLACE_IN_TRUENAS_UI"
      API_TIMEOUT_SECONDS: "30"
    volumes:
      - /mnt/POOL/apps/immich-curator:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
