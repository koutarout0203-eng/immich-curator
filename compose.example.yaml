services:
  curator-worker:
    image: ghcr.io/koutarout0203-eng/immich-curator:v0.3.0
    container_name: immich-curator-worker
    restart: unless-stopped
    environment:
      IMMICH_BASE_URL: "${IMMICH_BASE_URL:-http://192.168.14.37:2283}"
      IMMICH_API_KEY: "${IMMICH_API_KEY:?set IMMICH_API_KEY outside Git}"
      API_TIMEOUT_SECONDS: "30"
      TZ: "Asia/Tokyo"
      IMMICH_PUBLIC_URL: "${IMMICH_PUBLIC_URL:-http://192.168.14.37:2283}"
    command:
      - trip-worker
      - --home-periods
      - /data/home-periods.json
      - --data-dir
      - /data
      - --settle-hours
      - "72"
      - --historical-review-days
      - "30"
      - --weekday
      - "6"
      - --time
      - "06:00"
    volumes:
      - ${CURATOR_DATA_PATH:-/mnt/tanico-nas/apps/immich-curator/data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m

  curator-web:
    image: ghcr.io/koutarout0203-eng/immich-curator:v0.3.0
    container_name: immich-curator-web
    restart: unless-stopped
    environment:
      IMMICH_BASE_URL: "${IMMICH_BASE_URL:-http://192.168.14.37:2283}"
      IMMICH_PUBLIC_URL: "${IMMICH_PUBLIC_URL:-http://192.168.14.37:2283}"
      IMMICH_API_KEY: "${IMMICH_API_KEY:?set IMMICH_API_KEY outside Git}"
      CURATOR_UI_USERNAME: "${CURATOR_UI_USERNAME:?set CURATOR_UI_USERNAME outside Git}"
      CURATOR_UI_PASSWORD: "${CURATOR_UI_PASSWORD:?set CURATOR_UI_PASSWORD outside Git}"
      API_TIMEOUT_SECONDS: "30"
      TZ: "Asia/Tokyo"
    command:
      - suggestions-app
      - --input
      - /data/visual-memories.json
      - --feedback
      - /data/suggestion-feedback.json
      - --host
      - 0.0.0.0
      - --port
      - "20810"
    ports:
      - "20810:20810"
    volumes:
      - ${CURATOR_DATA_PATH:-/mnt/tanico-nas/apps/immich-curator/data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
