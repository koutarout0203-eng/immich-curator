[project]
name = "immich-curator"
version = "0.3.0"
requires-python = ">=3.11"
description = "Read-only Immich memory suggestion curator"
dependencies = ["Pillow>=11,<13", "tzdata>=2025.2"]

[project.scripts]
immich-curator = "curator.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["curator", "curator.web"]

[tool.setuptools.package-data]
curator = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
