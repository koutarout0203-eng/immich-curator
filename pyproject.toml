[project]
name = "immich-curator"
version = "0.2.0"
requires-python = ">=3.11"
description = "Read-only Immich memory suggestion curator"
dependencies = ["Pillow>=11,<13"]

[project.scripts]
immich-curator = "curator.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
